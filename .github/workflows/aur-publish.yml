name: Publish to AUR

on:
  # STORIA — perché qui NON c'è più `workflow_run`:
  # Questo workflow si agganciava a `workflow_run: ["Build and Release"]`.
  # Non può funzionare: da v2.9.5 "Build and Release" non è più scatenato dal
  # push del tag ma è dispatchato da release.yml con `gh workflow run`
  # autenticato col GITHUB_TOKEN, e GitHub NON emette eventi (workflow_run
  # incluso) per run creati col GITHUB_TOKEN — è la protezione anti-loop.
  # Risultato: da v2.9.5 a v2.10.2 questo workflow non è mai partito e l'AUR
  # è rimasto fermo a 2.9.4 senza che nulla fallisse.
  #
  # La pubblicazione automatica è ora il job `publish-aur` dentro main.yml, che
  # gira nello stesso run del tag (needs: release) e quindi non dipende da
  # nessun evento derivato. Questo workflow resta per due motivi:
  #   1. retry manuale, se l'AUR era in manutenzione durante il release
  #      (è esattamente quello che è successo con v2.10.3);
  #   2. rete di sicurezza schedulata: ogni giorno confronta la versione
  #      pubblicata su AUR con il pkgver del default branch e ripubblica se
  #      l'AUR è rimasto indietro.
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch: {}  # retry manuale, nessun input necessario

concurrency:
  group: aur-publish
  cancel-in-progress: false

jobs:
  publish-aur:
    name: Push PKGBUILD to AUR
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        # Checkout del default branch (non del tag): stessa motivazione di vesta.
        # Gli script CI ricevono fix sul default branch; checkout del tag eseguirebbe
        # la versione al momento del release, potenzialmente buggata.
        # Il PKGBUILD sul default branch riflette sempre l'ultimo release stabile
        # perché semantic-release lo aggiorna e committa prima di taggare.

      - name: Check AUR drift
        id: drift
        shell: bash
        run: |
          set -euo pipefail
          PKGNAME=$(awk -F'=' '/^pkgname[[:space:]]*=/{print $2; exit}' build-publish-scripts/PKGBUILD | tr -d '\r' | xargs)
          PKGVER=$(awk -F'=' '/^pkgver[[:space:]]*=/{print $2; exit}' build-publish-scripts/PKGBUILD | tr -d '\r' | xargs)
          PKGREL=$(awk -F'=' '/^pkgrel[[:space:]]*=/{print $2; exit}' build-publish-scripts/PKGBUILD | tr -d '\r' | xargs)
          EXPECTED="${PKGVER}-${PKGREL}"

          AUR_VERSION=$(curl --silent --fail --max-time 30 \
            "https://aur.archlinux.org/rpc/v5/info?arg%5B%5D=${PKGNAME}" \
            | grep -oP '"Version":"\K[^"]+' | head -n1 || true)

          echo "Repo:  $EXPECTED"
          echo "AUR:   ${AUR_VERSION:-<non leggibile>}"

          # Su dispatch manuale si procede sempre (l'RPC può essere down proprio
          # quando serve il retry); ci-push-aur.sh è comunque idempotente ed esce
          # senza errori se non c'è nulla da pushare.
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$AUR_VERSION" = "$EXPECTED" ]; then
            echo "AUR già allineato, niente da fare."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Normalize line endings
        if: steps.drift.outputs.skip != 'true'
        shell: bash
        run: |
          sed -i 's/\r$//' build-publish-scripts/PKGBUILD
          sed -i 's/\r$//' build-publish-scripts/ci-push-aur.sh

      - name: Get version
        id: version
        if: steps.drift.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(awk -F'=' '/^pkgver[[:space:]]*=/{print $2; exit}' build-publish-scripts/PKGBUILD | tr -d '\r' | xargs)
          if [ -z "$VERSION" ]; then
            echo "::error::pkgver non trovato in build-publish-scripts/PKGBUILD"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Versione: $VERSION"

      - name: Wait for release asset availability
        if: steps.drift.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd build-publish-scripts

          # The source= line uses shell variables (${pkgver}), so we cannot
          # grep a literal https:// URL with version already substituted.
          # We read the variables and construct the URL explicitly.
          PKGVER=$(awk -F'=' '/^pkgver[[:space:]]*=/{print $2; exit}' PKGBUILD | tr -d '\r' | xargs)
          BASE_URL=$(grep -oP '^url="\K[^"]+' PKGBUILD | head -n1)
          # _pkgname is the binary/archive name used in the release asset filename
          PKGNAME=$(grep -oP '^_pkgname=\K\S+' PKGBUILD | head -n1)
          if [ -z "$PKGNAME" ]; then
            # fallback: strip -bin suffix from pkgname
            PKGNAME=$(grep -oP '^pkgname=\K\S+' PKGBUILD | head -n1 | sed 's/-bin$//')
          fi

          ASSET_URL="${BASE_URL}/releases/download/v${PKGVER}/${PKGNAME}_${PKGVER}_amd64.deb"
          echo "Verifico disponibilità: $ASSET_URL"

          for i in $(seq 1 18); do
            if curl --silent --fail --head "$ASSET_URL" > /dev/null; then
              echo "Asset disponibile (tentativo $i)."
              exit 0
            fi
            echo "Tentativo $i/18 fallito, riprovo in 10s..."
            sleep 10
          done
          echo "::error::Asset non disponibile dopo 3 minuti di attesa: $ASSET_URL"
          exit 1

      - name: Prepare SSH materials
        if: steps.drift.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ssh"
          printf '%s\n' "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > "$RUNNER_TEMP/ssh/id_aur"
          printf '%s\n' "${{ secrets.AUR_KNOWN_HOSTS }}" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/id_aur"

          # Stampa SOLO il fingerprint pubblico (mai la chiave): serve a capire
          # a colpo d'occhio se il segreto corrisponde a una chiave registrata
          # su https://aur.archlinux.org/account/ quando l'AUR risponde
          # "Permission denied (publickey)".
          echo "Fingerprint della chiave SSH in uso:"
          ssh-keygen -lf "$RUNNER_TEMP/ssh/id_aur" || \
            echo "::warning::impossibile leggere il fingerprint: AUR_SSH_PRIVATE_KEY non e' una chiave valida"

      - name: Write container entrypoint
        if: steps.drift.outputs.skip != 'true'
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/entrypoint.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          pacman-key --init || true
          pacman-key --populate archlinux || true
          pacman -Sy --noconfirm archlinux-keyring || true
          pacman -Syu --noconfirm git sudo openssh pacman-contrib base-devel

          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers

          mkdir -p /home/builder/.ssh
          cp /ssh-input/id_aur /home/builder/.ssh/id_aur
          cp /ssh-input/known_hosts /home/builder/.ssh/known_hosts

          cat > /home/builder/.ssh/config <<'SSHCONF'
          Host aur.archlinux.org
            User aur
            IdentityFile /home/builder/.ssh/id_aur
            IdentitiesOnly yes
            UserKnownHostsFile /home/builder/.ssh/known_hosts
            StrictHostKeyChecking yes
          SSHCONF

          chown -R builder:builder /home/builder/.ssh
          chmod 700 /home/builder/.ssh
          chmod 600 /home/builder/.ssh/id_aur /home/builder/.ssh/config
          chmod 644 /home/builder/.ssh/known_hosts

          exec su - builder -c /workspace/build-publish-scripts/ci-push-aur.sh
          EOF
          chmod +x "$RUNNER_TEMP/entrypoint.sh"

      - name: Build & push AUR package
        if: steps.drift.outputs.skip != 'true'
        shell: bash
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -v "$RUNNER_TEMP/ssh:/ssh-input:ro" \
            -v "$RUNNER_TEMP/entrypoint.sh:/entrypoint.sh:ro" \
            archlinux:base-devel bash /entrypoint.sh
